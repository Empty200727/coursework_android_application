name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Tests use fixtures and fakes: no TMDB token is needed.
      - name: Build, tests and static analysis
        run: ./gradlew assembleDebug testDebugUnitTest lint checkstyle coverageVerify --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            build/reports
