# Overrides on top of the default detekt configuration (--build-upon-default-config).

build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 16
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInInterfaces: 16
    ignorePrivate: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/core/ui/theme/**'
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: false
